<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Quality Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; }
        .container-wrap { max-width: 1400px; margin: 24px auto; }
        .kpi-card { border: 0; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
        .kpi-value { font-size: 1.6rem; font-weight: 700; }
        .small-muted { color: #6c757d; font-size: 0.85rem; }
        .table-wrap { border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
<div class="container-wrap px-3">
    <div id="accessHint" class="alert alert-warning d-none" role="alert"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h3 class="mb-1">数据质量面板</h3>
            <div id="generatedAt" class="small-muted">加载中...</div>
        </div>
        <div class="d-flex gap-2">
            <button id="refreshBtn" class="btn btn-primary">刷新快照</button>
            <a href="/" class="btn btn-outline-secondary">返回主页</a>
        </div>
    </div>

    <div class="row g-3 mb-3" id="kpiRow"></div>

    <div class="card kpi-card mb-3">
        <div class="card-body d-flex flex-wrap gap-3 align-items-center">
            <label class="form-check d-flex align-items-center gap-2 mb-0">
                <input id="onlyIssues" class="form-check-input" type="checkbox">
                <span class="form-check-label">只看异常 symbol</span>
            </label>

            <label class="d-flex align-items-center gap-2 mb-0">
                <span class="small-muted">排序字段</span>
                <select id="sortBy" class="form-select form-select-sm" style="width: 220px;">
                    <option value="last_updated_age_hours">最近更新时间(小时)</option>
                    <option value="parse_failure_rate">解析失败率</option>
                    <option value="duplicate_rate">重复率</option>
                    <option value="count_1d">近1天文章数</option>
                    <option value="count_7d">近7天文章数</option>
                    <option value="count_30d">近30天文章数</option>
                </select>
            </label>

            <label class="d-flex align-items-center gap-2 mb-0">
                <span class="small-muted">顺序</span>
                <select id="sortOrder" class="form-select form-select-sm" style="width: 120px;">
                    <option value="desc">降序</option>
                    <option value="asc">升序</option>
                </select>
            </label>

            <button id="reloadBtn" class="btn btn-outline-primary btn-sm">应用</button>
        </div>
    </div>

    <div class="table-wrap bg-white">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Symbol</th>
                    <th>最近更新时间</th>
                    <th>近1天</th>
                    <th>近7天</th>
                    <th>近30天</th>
                    <th>计数原因</th>
                    <th>空文件</th>
                    <th>重复率</th>
                    <th>解析失败率</th>
                </tr>
                </thead>
                <tbody id="symbolTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:5002' : '';

function apiUrl(path) {
    return `${API_BASE}${path}`;
}

function showAccessHint() {
    const el = document.getElementById('accessHint');
    if (window.location.protocol === 'file:') {
        el.textContent = '当前页面是以本地文件方式打开的，已尝试回退到 http://127.0.0.1:5002 访问 Flask API。若仍失败，请先启动 Flask 服务并通过 /quality 路由访问。';
        el.classList.remove('d-none');
    }
}

async function fetchJson(url, options = {}) {
    const res = await fetch(url, options);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
}

function pct(v) {
    if (v === null || v === undefined) return '-';
    return (Number(v) * 100).toFixed(2) + '%';
}

function formatAge(hours) {
    if (hours === null || hours === undefined) return '-';
    if (hours < 24) return `${hours.toFixed(1)}h`;
    return `${(hours / 24).toFixed(1)}d`;
}

function zeroCountReason(r) {
    const c1 = Number(r.count_1d || 0);
    const c7 = Number(r.count_7d || 0);
    const c30 = Number(r.count_30d || 0);

    if (c1 > 0 || c7 > 0 || c30 > 0) return '-';
    if (!r.has_file) return '无文件';
    if (r.is_empty_file) return '空文件';

    const validRows = Number(r.valid_rows || 0);
    const parseFailures = Number(r.parse_failures || 0);
    const ageHours = r.last_updated_age_hours;

    if (validRows === 0 && parseFailures > 0) return '全部解析失败';
    if (validRows === 0) return '无有效记录';
    if (ageHours !== null && ageHours !== undefined && ageHours > 24 * 30) return '仅30天外历史';
    if (parseFailures > 0) return '时间字段解析异常';
    return '近30天无新闻/时间缺失';
}

function setKpis(summary) {
    const kpis = [
        ['Universe', summary.universe_total],
        ['Coverage', pct(summary.coverage_ratio)],
        ['Empty Files', summary.empty_file_total],
        ['Duplicate Rate', pct(summary.duplicate_rate)],
        ['Parse Failure Rate', pct(summary.parse_failure_rate)],
        ['Fresh 24h', summary.fresh_24h],
        ['Stale > 7d', summary.stale_7d],
        ['raw_news.db Total', summary.raw_news_db_total ?? '-'],
    ];

    const html = kpis.map(([label, value]) => `
        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card kpi-card">
                <div class="card-body">
                    <div class="small-muted">${label}</div>
                    <div class="kpi-value">${value}</div>
                </div>
            </div>
        </div>
    `).join('');

    document.getElementById('kpiRow').innerHTML = html;
}

function setTable(rows) {
    const tbody = document.getElementById('symbolTableBody');
    tbody.innerHTML = rows.map(r => `
        <tr>
            <td><strong>${r.symbol}</strong></td>
            <td>${r.last_updated ? new Date(r.last_updated).toLocaleString() : '-'} <span class="small-muted">(${formatAge(r.last_updated_age_hours)})</span></td>
            <td>${r.count_1d}</td>
            <td>${r.count_7d}</td>
            <td>${r.count_30d}</td>
            <td>${zeroCountReason(r)}</td>
            <td>${r.is_empty_file ? '是' : '否'}</td>
            <td>${pct(r.duplicate_rate)}</td>
            <td>${pct(r.parse_failure_rate)}</td>
        </tr>
    `).join('');
}

async function loadOverview(refresh = false) {
    const data = await fetchJson(apiUrl(`/api/quality/overview?refresh=${refresh ? 1 : 0}`));
    if (!data.success) throw new Error(data.message || 'overview failed');
    setKpis(data.summary || {});
    document.getElementById('generatedAt').textContent = `快照时间: ${new Date(data.generated_at).toLocaleString()}`;
}

async function loadSymbols(refresh = false) {
    const onlyIssues = document.getElementById('onlyIssues').checked ? 1 : 0;
    const sortBy = document.getElementById('sortBy').value;
    const order = document.getElementById('sortOrder').value;
    const url = apiUrl(`/api/quality/symbols?refresh=${refresh ? 1 : 0}&only_issues=${onlyIssues}&sort_by=${encodeURIComponent(sortBy)}&order=${order}&limit=300`);
    const data = await fetchJson(url);
    if (!data.success) throw new Error(data.message || 'symbols failed');
    setTable(data.symbols || []);
}

async function refreshAll(forceRefresh) {
    await loadOverview(forceRefresh);
    await loadSymbols(forceRefresh);
}

document.getElementById('refreshBtn').addEventListener('click', async () => {
    try {
        document.getElementById('refreshBtn').disabled = true;
        await fetchJson(apiUrl('/api/quality/refresh'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        await refreshAll(false);
    } catch (e) {
        alert('刷新失败: ' + e.message);
    } finally {
        document.getElementById('refreshBtn').disabled = false;
    }
});

document.getElementById('reloadBtn').addEventListener('click', async () => {
    try {
        await loadSymbols(false);
    } catch (e) {
        alert('加载失败: ' + e.message);
    }
});

showAccessHint();
refreshAll(true).catch((e) => alert('加载失败: ' + e.message));
</script>
</body>
</html>
